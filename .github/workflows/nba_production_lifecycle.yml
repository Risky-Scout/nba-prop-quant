name: NBA production lifecycle

# Automated daily NBA Prop Quant production lifecycle.
#
# GitHub orchestrates; Python decides. Every rule about semantic state,
# training cutoff, information-set eligibility, adaptive action selection,
# candidate construction, validation, registration and promotion lives in
# ops/run_adaptive_daily_fit.py and the adaptive training module. This file
# sequences those calls and reports what happened; it contains no modelling
# logic and no policy conditionals. What a refresh exit code means for the
# lifecycle — including the preseason no-op before opening day — is decided by
# ops/classify_refresh_outcome.py, not by YAML.
#
# DEFAULT-BRANCH BEHAVIOUR
# ------------------------
# The repository default branch is `main`, and GitHub only fires scheduled
# events from the default branch. Production code lives on
# `production/wizardofodds-integration`. So this workflow is written to run
# correctly from either: it always checks out the authoritative production ref
# explicitly and then proves, in Python, that the checkout really is that ref
# before anything is allowed to touch production state. It never runs the
# model from whatever the default branch happens to contain.
#
# To activate the schedule, this file must also exist on the default branch.
# See docs/wizardofodds/PRODUCTION_AUTOMATION.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate-only proves the wiring; production runs the lifecycle'
        type: choice
        options:
          - validate-only
          - production
        default: validate-only
      slate_date:
        description: 'Slate date YYYY-MM-DD. Defaults to today in US/Eastern.'
        type: string
        required: false
      production_ref:
        description: 'Authoritative production ref to check out'
        type: string
        required: false
        default: production/wizardofodds-integration

  schedule:
    # 09:37 UTC daily. Deliberately off the top of the hour, where GitHub's
    # scheduler is most congested and jobs are most often delayed or dropped.
    # 09:37 UTC is 05:37 US/Eastern in daylight time and 04:37 in standard
    # time, which is after every North American box score has settled and well
    # before the T-20 capture window of that evening's slate. The repository
    # documented no prior schedule policy, so this is the minimum reliable
    # daily trigger; the rationale is recorded in
    # docs/wizardofodds/PRODUCTION_AUTOMATION.md.
    - cron: '37 9 * * *'

permissions:
  contents: read

concurrency:
  # One production lifecycle at a time. A scheduled run and a manual run share
  # this group, so they queue rather than race. Queued rather than cancelled:
  # cancelling mid-flight could interrupt a registry write or leave a refresh
  # transaction prepared but unresolved, and the repository's own locks are
  # what make that recoverable. GitHub concurrency supplements the flock the
  # trainer and the refresh already take; it does not replace it.
  group: nba-production-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: NBA production lifecycle
    # The self-hosted `nba-production` runner is the durable state backend.
    # Its filesystem survives between runs, which is what makes
    # current_good_fit_id, the rollback target, the 2001→present rolling data
    # root and Step 3C's no-new-data detection mean anything. A GitHub-hosted
    # runner is destroyed at the end of the job and would silently reset all
    # of them. Only this job — the one that mutates production — runs here;
    # pull-request validation stays on GitHub-hosted runners so untrusted
    # branch code never executes on the machine that holds production state.
    runs-on:
      - self-hosted
      - nba-production
    timeout-minutes: 360
    environment: wizardofodds-production

    env:
      MODE: ${{ github.event_name == 'schedule' && 'production' || inputs.mode }}
      PRODUCTION_REF: ${{ inputs.production_ref || 'production/wizardofodds-integration' }}

    steps:
      - name: Check out the authoritative production code
        uses: actions/checkout@v4
        with:
          # Explicit: a scheduled event originates from the default branch, so
          # the production ref is named rather than inherited.
          ref: ${{ github.event_name == 'schedule' && 'production/wizardofodds-integration' || (inputs.production_ref || 'production/wizardofodds-integration') }}
          fetch-depth: 0

      - name: Record the production checkout
        id: checkout
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Production code SHA: $SHA"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Workflow ref: ${{ github.ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The production runner is a long-lived Mac, and setup-python was
      # effectively a no-op on it: it reported a tool-cache interpreter while
      # the install below resolved to
      # /Library/Frameworks/Python.framework/.../site-packages. Every run
      # therefore installed into machine-global site-packages and ran under
      # whatever that machine had accumulated.
      #
      # So the run gets its own environment, created from the interpreter
      # setup-python just selected and discarded with RUNNER_TEMP. Putting it
      # on GITHUB_PATH is what makes every later `python` and `pip` in this
      # job resolve to it without any of those steps having to know it exists.
      - name: Create the per-run Python environment
        id: venv
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/production-venv"
          BOOTSTRAP="$(python -c 'import sys; print(sys.executable)')"
          echo "Bootstrap interpreter: $BOOTSTRAP"
          "$BOOTSTRAP" -m venv --clear "$VENV"
          echo "venv=$VENV" >> "$GITHUB_OUTPUT"
          echo "architecture=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install the production package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # Fails the job when the interpreter resolves outside the environment
      # above. It runs after the install because the question is where the
      # dependencies actually landed, not where they were meant to.
      - name: Verify the production interpreter is isolated
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run"
          python ops/verify_production_interpreter.py \
            --expected-venv "${{ steps.venv.outputs.venv }}" \
            --expected-architecture "${{ steps.venv.outputs.architecture }}" \
            --production-sha "${{ steps.checkout.outputs.sha }}" \
            --status-path "$RUNNER_TEMP/run/interpreter.json" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Preflight
        id: preflight
        env:
          # Presence is checked by name. No value is printed by the preflight.
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
          NBA_PROP_FIT_REGISTRY_DIR: ${{ vars.NBA_PROP_FIT_REGISTRY_DIR }}
          NBA_PROP_WORK_DIR: ${{ vars.NBA_PROP_WORK_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run"
          python ops/production_lifecycle_preflight.py \
            --mode "$MODE" \
            --expected-ref "$PRODUCTION_REF" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --status-path "$RUNNER_TEMP/run/preflight.json"

      # Everything below requires durable production state. The preflight
      # above fails closed when no backend is configured, so these steps do
      # not run and no partial mutation can occur.

      - name: Refresh the current-season rolling state
        if: env.MODE == 'production'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
        run: |
          set -euo pipefail
          SLATE="${{ inputs.slate_date }}"
          if [ -z "$SLATE" ]; then
            SLATE="$(TZ=America/New_York date +%F)"
          fi
          echo "slate=$SLATE" >> "$GITHUB_ENV"
          set +e
          python ops/refresh_current_season_state.py \
            --slate-date "$SLATE" \
            --data-dir "$NBA_PROP_DATA_DIR"
          REFRESH_EXIT=$?
          set -e
          # The refresh returns the readiness preflight's own exit code. What
          # that code means for the lifecycle is decided in Python, not here:
          # exit 0 continues, a verified PRESEASON_BLOCK is a safe no-op, and
          # every other nonzero code is re-raised so the job fails closed.
          python ops/classify_refresh_outcome.py \
            --refresh-exit-code "$REFRESH_EXIT" \
            --slate-date "$SLATE" \
            --status-path "$RUNNER_TEMP/run/refresh.json" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --github-env "$GITHUB_ENV"

      # RUN_ADAPTIVE is written by the classifier above. The workflow reads
      # that decision; it does not make one.
      - name: Run the adaptive daily protocol
        if: env.MODE == 'production' && env.RUN_ADAPTIVE == 'true'
        env:
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
          NBA_PROP_FIT_REGISTRY_DIR: ${{ vars.NBA_PROP_FIT_REGISTRY_DIR }}
          NBA_PROP_WORK_DIR: ${{ vars.NBA_PROP_WORK_DIR }}
        run: |
          set -euo pipefail
          # The policy decides whether this is a no-op or a refit. The
          # workflow does not decide; it reports what the policy chose.
          python ops/run_adaptive_daily_fit.py \
            --register-candidate \
            --slate-date "$slate" \
            --data-root "$NBA_PROP_DATA_DIR" \
            --registry-root "$NBA_PROP_FIT_REGISTRY_DIR" \
            --work-root "$NBA_PROP_WORK_DIR" \
            | tee "$RUNNER_TEMP/run/adaptive.json"

      # The incumbent prices the slate. Nothing automated did this before:
      # the lifecycle refreshed state, fitted a candidate and shadowed it,
      # and the artifact production actually serves was produced by hand.
      #
      # Gated on MODE alone, not on RUN_ADAPTIVE. Whether the incumbent
      # should price tonight's games is a different question from whether a
      # candidate was refitted this morning, and binding them would mean a
      # future off-day fit policy silently stopped production serving. The
      # entry point reads the refresh classifier's own status file and
      # decides readiness itself, so a preseason day is a recorded no-op
      # rather than a skipped step.
      #
      # No continue-on-error, on purpose: failing to produce the incumbent's
      # priced markets on a real slate is a production failure and the job
      # must go red. It runs after the adaptive fit and before the shadow so
      # that serving is complete before any candidate work is observed, and
      # it resolves the incumbent from the registry's promotion state rather
      # than from the candidate the step above just registered.
      - name: Serve the slate with the incumbent
        if: env.MODE == 'production'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
          NBA_PROP_FIT_REGISTRY_DIR: ${{ vars.NBA_PROP_FIT_REGISTRY_DIR }}
        run: |
          set -euo pipefail
          python ops/run_incumbent_production_serving.py \
            --slate-date "$slate" \
            --data-root "$NBA_PROP_DATA_DIR" \
            --registry-root "$NBA_PROP_FIT_REGISTRY_DIR" \
            --refresh-status "$RUNNER_TEMP/run/refresh.json" \
            --production-sha "${{ steps.checkout.outputs.sha }}" \
            --receipt-path "$RUNNER_TEMP/run/incumbent_serving.json" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      # Grades the slate before this one against settled box scores. The cron
      # runs at 09:37 UTC, after every North American box score has settled,
      # so yesterday is the most recent slate whose outcomes exist; today's
      # games have not been played.
      #
      # Ungated on RUN_ADAPTIVE for the same reason serving is: whether
      # yesterday's results can be scored has nothing to do with whether a
      # candidate was refitted this morning. It runs after serving so that a
      # grading problem can never delay or block the artifact production
      # actually serves, which is also why it reads only the durable serving
      # receipt and the settled box scores and writes only grade rows.
      #
      # It also persists *today's* serving receipt, which the step above
      # writes into RUNNER_TEMP and which dies with the run. A slate is graded
      # on a later day than it was served, so without a durable copy every
      # grade row would be unable to name the incumbent that produced it. The
      # copy is made here rather than by editing the serving step, because the
      # serving step is the production path and this lineage is only permitted
      # to add to this workflow, never to rewrite a line of it.
      #
      # A game that had not finished produces PENDING_SETTLEMENT and exit 0;
      # --catch-up-days revisits it on a later run. Only a genuine fault --
      # provenance that does not describe the rows being graded, a slate
      # priced after its own games, ambiguous settlement -- exits nonzero,
      # and those deserve a red job.
      - name: Grade the incumbent's previous slate
        if: env.MODE == 'production'
        env:
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
        run: |
          set -euo pipefail
          receipts="$NBA_PROP_DATA_DIR/processed/incumbent_serving"
          mkdir -p "$receipts"
          if [ -f "$RUNNER_TEMP/run/incumbent_serving.json" ]; then
            cp "$RUNNER_TEMP/run/incumbent_serving.json" "$receipts/$slate.json"
          fi
          # Python rather than `date -d`, which is GNU-only, and this runner
          # is a Mac. One expression, so one line.
          graded="$(python -c 'import datetime,sys;print(datetime.date.fromisoformat(sys.argv[1])-datetime.timedelta(days=1))' "$slate")"
          echo "Grading the slate before $slate: $graded"
          python ops/grade_incumbent_production_slate.py \
            --slate-date "$graded" \
            --data-root "$NBA_PROP_DATA_DIR" \
            --receipt-path "$RUNNER_TEMP/run/incumbent_grading.json" \
            --catch-up-days 7

      # SHADOW ONLY, and deliberately non-blocking. The incumbent is the
      # served and published authority on every row; this step records what
      # the same-game dependence candidate would have said, beside it.
      #
      # continue-on-error, and no --strict: a shadow that can fail the
      # production lifecycle is worse than no shadow, so the entry point
      # catches its own failures, records them and exits 0, and this setting
      # is the belt to that braces. It runs after the adaptive fit because it
      # reads that fit's own marginals.joblib and copula.joblib — the objects
      # the live pricing path prices with — rather than a parallel fit of its
      # own. It writes only into the run's temporary directory.
      - name: Shadow the slate beside production
        if: env.MODE == 'production' && env.RUN_ADAPTIVE == 'true'
        continue-on-error: true
        env:
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
        run: |
          set -euo pipefail
          python ops/run_production_shadow.py \
            --slate-date "$slate" \
            --adaptive-status "$RUNNER_TEMP/run/adaptive.json" \
            --log-path "$RUNNER_TEMP/run/shadow_log.jsonl" \
            --grading-path "$RUNNER_TEMP/run/shadow_grading.json" \
            --status-path "$RUNNER_TEMP/run/shadow.json" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      # Accumulates the shadow's evidence durably and reads the frozen
      # promotion policy over the running total.
      #
      # It has to accumulate because the shadow step above writes only into
      # RUNNER_TEMP, which GitHub destroys with the job, while the policy's
      # minimum evidence requirement is 500 graded games over 30
      # regular-season days. Every number it gates on is a sum over runs that
      # no longer exist, so this step copies the day's evidence into the
      # durable state root first. The copy is made here rather than by
      # pointing the shadow at a durable path for the same reason the serving
      # receipt is copied in the grading step: those are pre-existing
      # lifecycle and this lineage may add steps, never rewrite one.
      #
      # Ungated on RUN_ADAPTIVE, unlike the shadow itself. The shadow only has
      # something to say on a day it refitted, but the accumulated window is
      # the thing the policy judges, and it should be summarised every
      # production day -- including a day with no retrain, where the
      # incumbent's own grading did run and the answer is still
      # CONTINUE_SHADOW rather than silence. Missing shadow files for today
      # are a recorded absence, not a failure.
      #
      # Placed before the health assertion, not after. The assertion is
      # blocking, so monitoring behind it would be skipped on exactly the
      # days a shadow is unhealthy, which are the days the accumulated safety
      # read matters most.
      #
      # No continue-on-error, on purpose, but it only fails the job on one
      # decision: SHADOW_DISABLED_FOR_SAFETY, which the frozen policy reaches
      # when a publishing violation is observed or an operational gate
      # implicates the incumbent feed. An insufficient sample is not a
      # failure -- CONTINUE_SHADOW is the normal state before the evidence
      # minimum and exits 0. A red job here costs production nothing:
      # serving and grading are already complete, this step writes no
      # prediction and no serving authority, and the incumbent never
      # depended on the shadow.
      - name: Monitor the accumulated live shadow evidence
        if: env.MODE == 'production'
        env:
          NBA_PROP_DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
        run: |
          set -euo pipefail
          state="$NBA_PROP_DATA_DIR/processed/live_shadow_monitoring"
          status="$state/live_shadow_monitoring.json"
          mkdir -p "$state"
          python ops/monitor_live_shadow_evidence.py \
            --slate-date "$slate" \
            --data-root "$NBA_PROP_DATA_DIR" \
            --shadow-log "$RUNNER_TEMP/run/shadow_log.jsonl" \
            --shadow-status "$RUNNER_TEMP/run/shadow.json" \
            --shadow-grading "$RUNNER_TEMP/run/shadow_grading.json" \
            --production-sha "${{ steps.checkout.outputs.sha }}" \
            --status-path "$status" \
            --summary-path "$GITHUB_STEP_SUMMARY"
          # Into the diagnostics artifact as well as the durable state, so a
          # run can be read from its GitHub artifact alone.
          cp "$status" "$RUNNER_TEMP/run/live_shadow_monitoring.json"

      # The shadow step above is non-blocking on purpose and must stay that
      # way, which left GitHub going green whether the shadow worked or not.
      # This reads the status file the shadow persisted rather than the step's
      # conclusion — the signal that cannot be trusted here — and is allowed
      # to fail the job. Incumbent serving is already done by this point and
      # this step writes nothing, so a red job here costs production nothing
      # and is the only way an unhealthy shadow becomes visible.
      #
      # always(), so a shadow that was expected to run and left no status
      # behind is reported rather than skipped.
      - name: Assert the candidate shadow was healthy
        if: always() && env.MODE == 'production' && env.RUN_ADAPTIVE == 'true'
        run: |
          set -euo pipefail
          python ops/evaluate_shadow_health.py \
            --status-path "$RUNNER_TEMP/run/shadow.json" \
            --shadow-was-expected \
            --health-path "$RUNNER_TEMP/run/shadow_health.json" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Report the run
        if: always()
        run: |
          set -euo pipefail
          python ops/summarise_production_run.py \
            --preflight "$RUNNER_TEMP/run/preflight.json" \
            --refresh "$RUNNER_TEMP/run/refresh.json" \
            --adaptive "$RUNNER_TEMP/run/adaptive.json" \
            --production-sha "${{ steps.checkout.outputs.sha }}" \
            --trigger "${{ github.event_name }}" \
            --mode "$MODE" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --status-path "$RUNNER_TEMP/run/run_status.json"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-production-run-${{ github.run_id }}
          path: ${{ runner.temp }}/run
          retention-days: 14
          if-no-files-found: warn
