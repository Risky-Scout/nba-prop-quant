name: zz-tmp-runner-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, nba-production]
    timeout-minutes: 8
    env:
      DATA_DIR: ${{ vars.NBA_PROP_DATA_DIR }}
    steps:
      - name: collect
        run: |
          set -u
          D="$RUNNER_TEMP/zzprobe"; mkdir -p "$D"
          {
            echo "date=$(date -u +%FT%TZ)"
            id
            hostname
            uname -a
            sw_vers 2>/dev/null
            echo "runner_name=${RUNNER_NAME:-}"
            echo "workspace=${RUNNER_WORKSPACE:-}"
            echo "data_dir=${DATA_DIR:-unset}"
          } > "$D/01_identity.txt" 2>&1
          { ls -la "$HOME/.ssh" 2>&1; } > "$D/02_ssh_ls.txt"
          awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*(Host|HostName|User|Port|IdentityFile)[[:space:]]/{print}' "$HOME/.ssh/config" > "$D/03_ssh_config.txt" 2>/dev/null
          [ -s "$D/03_ssh_config.txt" ] || echo "no ssh config or no matching lines" > "$D/03_ssh_config.txt"
          awk '{print $1}' "$HOME/.ssh/known_hosts" 2>/dev/null | sed 's/,.*//' | sed -E 's/^\|.*$/[HASHED]/' | sort -u | head -40 > "$D/04_known_hosts.txt"
          {
            for k in "$HOME"/.ssh/id_*; do
              [ -f "$k" ] || continue
              case "$k" in *.pub) continue;; esac
              echo "$k :: $(ssh-keygen -lf "$k" 2>&1 | head -1)"
            done
            for k in "$HOME"/.ssh/*.pem "$HOME"/.ssh/*key*; do
              [ -f "$k" ] || continue
              case "$k" in *.pub|*/known_hosts*|*/config) continue;; esac
              echo "$k :: $(ssh-keygen -lf "$k" 2>&1 | head -1)"
            done
            ssh-add -l 2>&1 | head -20
          } > "$D/05_keys_agent.txt" 2>&1
          {
            grep -rIl --binary-files=without-match -E '13\.52\.111\.2|:33333|APP_SECRET|BEGIN OPENSSH' "${RUNNER_WORKSPACE:-$HOME/_work}" 2>/dev/null | grep -v 'zz-tmp' | head -60
            if [ -n "${DATA_DIR:-}" ] && [ -d "${DATA_DIR:-}" ]; then
              grep -rIl --binary-files=without-match -E '13\.52\.111\.2|:33333|APP_SECRET|BEGIN OPENSSH' "$DATA_DIR" 2>/dev/null | grep -v 'zz-tmp' | head -40
            fi
          } > "$D/06_grep_hits.txt" 2>&1
          { grep -hE '13\.52\.111\.2|33333' "$HOME/.zsh_history" "$HOME/.bash_history" 2>/dev/null | head -40; } > "$D/07_history_hits.txt" 2>&1
          {
            echo "== egress_ip =="; curl -sS --max-time 20 https://api.ipify.org 2>&1; echo
            for p in 22 33333 443; do
              echo "== nc 13.52.111.2 $p =="
              nc -vz -w 5 13.52.111.2 $p 2>&1
              echo "rc=$?"
            done
          } > "$D/08_reach.txt" 2>&1
          cd "$D"
          for f in *.txt; do base64 < "$f" > "$f.b64"; done
          wc -c *.txt | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: zz-probe-out
          path: ${{ runner.temp }}/zzprobe
          retention-days: 1
