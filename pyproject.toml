[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-prop-quant"
version = "0.1.0"
description = "BDL-native, interpretable NBA player box-score projection and prop-pricing system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "joblib>=1.4",
  "numba>=0.60",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "shap>=0.46",
  "tenacity>=9.0",
  "typer>=0.12",
  "xgboost>=2.1"
]

[project.optional-dependencies]
sequence = ["torch>=2.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
