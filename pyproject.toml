[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-prop-quant"
version = "0.1.0"
description = "BDL-native, interpretable NBA player box-score projection and prop-pricing system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "joblib>=1.4",
  "numba>=0.60",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  # Pinned, not a floor. The frozen Gate 3 artifacts were produced under
  # scikit-learn 1.9.0 (see models/frozen_manifests/LATEST.json), and
  # unpickling an estimator under a different version is not a guaranteed
  # round trip. ops/production_lifecycle_preflight.py re-checks this against
  # the freeze manifest at run time.
  "scikit-learn==1.9.0",
  "scipy>=1.14",
  "shap>=0.46",
  "tenacity>=9.0",
  "typer>=0.12",
  # Package selection, not a behaviour change. The import stays `xgboost`, the
  # version is the same on both platforms, and no parameter, thread count,
  # seed or Booster load changes: `xgboost-cpu` is the same upstream release
  # built without the GPU plugin.
  #
  # The reason is the dependency the GPU build declares. The `xgboost` wheel
  # requires `nvidia-nccl-cu13; platform_system == "Linux"`, so every Linux
  # install pulls a 291 MB CUDA collective-communication library. This project
  # trains and predicts on CPU, has no GPU production path, and nothing here
  # loads NCCL -- so on Linux that payload was downloaded and installed on
  # every CI run and every fresh environment to be used by nothing.
  #
  # Pinned rather than floored, and pinned to the version production already
  # serves under. `xgboost-cpu` publishes no macOS wheel, which is also why
  # the marker is a selection rather than a plain substitution: the production
  # runner is a Mac and takes `xgboost`, whose macOS wheel has no NVIDIA
  # requirement to shed.
  "xgboost-cpu==3.4.1; sys_platform == 'linux'",
  "xgboost==3.4.1; sys_platform != 'linux'"
]

[project.optional-dependencies]
sequence = ["torch>=2.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
